name: Publish to npm and Create Release

on:
    push:
        branches:
            - 'develop'
            - 'v3'
            - 'v4'
            - 'v5.1'
            - 'v5'
            - 'v6*'

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - uses: JS-DevTools/npm-publish@v4
              id: publish
              continue-on-error: true
              with:
                  token: ${{ secrets.NPM_TOKEN }}

            - name: Check publish result
              if: steps.publish.outcome == 'failure'
              run: |
                  echo "::notice::Package was not published. Version may already exist on npm."
                  exit 0

            - name: Get package version
              if: steps.publish.outputs.type != 'none' && steps.publish.outcome == 'success'
              id: package-version
              run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

            - name: Create Git tag
              if: steps.publish.outputs.type != 'none' && steps.publish.outcome == 'success'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "v${{ steps.package-version.outputs.version }}" -m "Release v${{ steps.package-version.outputs.version }}"
                  git push origin "v${{ steps.package-version.outputs.version }}"

            - name: Create GitHub Release
              if: steps.publish.outputs.type != 'none' && steps.publish.outcome == 'success'
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ steps.package-version.outputs.version }}
                  name: v${{ steps.package-version.outputs.version }}
                  generate_release_notes: true
                  body: |
                      Published to npm: https://www.npmjs.com/package/superdesk-ui-framework/v/${{ steps.package-version.outputs.version }}
                  draft: false
                  prerelease: false
