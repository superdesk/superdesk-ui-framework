name: Publish to npm and Create Release

on:
    workflow_dispatch:
        inputs:
            bump:
                description: 'Version bump before publishing (none = publish current package.json version)'
                required: true
                type: choice
                default: 'none'
                options:
                    - none
                    - patch
                    - minor
                    - major

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
            - run: npm install -g npm@11
            - run: npm ci

            - name: Bump version
              if: inputs.bump != 'none'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  npm version ${{ inputs.bump }} -m "Bump version to %s and release"

            - name: Resolve target version
              id: package-version
              run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

            - name: Ensure version is not already published
              run: |
                  VERSION="${{ steps.package-version.outputs.version }}"
                  if [ -n "$(npm view superdesk-ui-framework@"$VERSION" version 2>/dev/null)" ]; then
                      echo "::error::superdesk-ui-framework@$VERSION is already published to npm. Choose a version bump (patch/minor/major) and re-run."
                      exit 1
                  fi
                  echo "::notice::superdesk-ui-framework@$VERSION is available; proceeding to publish."

            - run: npm run lint
            - run: npm run build

            - uses: JS-DevTools/npm-publish@v4
              id: publish
              with:
                  provenance: true

            - name: Push version bump and tag
              if: inputs.bump != 'none'
              run: |
                  git push origin "HEAD:${{ github.ref_name }}"
                  git push origin "v${{ steps.package-version.outputs.version }}"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: v${{ steps.package-version.outputs.version }}
                  name: v${{ steps.package-version.outputs.version }}
                  generate_release_notes: true
                  body: |
                      Published to npm: https://www.npmjs.com/package/superdesk-ui-framework/v/${{ steps.package-version.outputs.version }}
                  draft: false
                  prerelease: false
